<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px 16px;
      background: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #333);
      font-size: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--figma-color-bg-secondary, #f5f5f5);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #e53e3e;
      transition: background 0.2s;
    }
    .dot.connected { background: #38a169; }
    .status-text {
      font-size: 11px;
      color: var(--figma-color-text-secondary, #666);
    }
  </style>
</head>
<body>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="statusText">Disconnected</span>
  </div>


  <script>
    const SERVER_URL = 'ws://localhost:3055';
    const MAX_RECONNECT_DELAY = 30000;

    let ws = null;
    let reconnectDelay = 1000;
    let reconnectTimer = null;

    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');

    function setConnected(connected) {
      if (connected) {
        dot.classList.add('connected');
        statusText.textContent = 'Connected';
      } else {
        dot.classList.remove('connected');
        statusText.textContent = 'Disconnected';
      }
    }

    function connect() {
      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

      try {
        ws = new WebSocket(SERVER_URL);
      } catch (_e) {
        scheduleReconnect();
        return;
      }

      ws.onopen = function() {
        reconnectDelay = 1000;
        setConnected(true);
        ws.send(JSON.stringify({ type: 'plugin_connected' }));
      };

      ws.onmessage = function(event) {
        try {
          const msg = JSON.parse(event.data);
          parent.postMessage({ pluginMessage: msg }, '*');
        } catch (_e) {}
      };

      ws.onclose = function() {
        setConnected(false);
        scheduleReconnect();
      };

      ws.onerror = function() {
        setConnected(false);
      };
    }

    function scheduleReconnect() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(function() {
        reconnectTimer = null;
        connect();
        reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
      }, reconnectDelay);
    }

    window.onmessage = function(event) {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'plugin_closing') {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'plugin_disconnected' }));
          ws.close();
        }
        return;
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    };

    connect();
  </script>
</body>
</html>
